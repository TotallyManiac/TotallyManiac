<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 155" width="380" height="155" role="img" aria-label="Bloch sphere with a single-qubit state vector">
  <defs>
    <linearGradient id="qBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1C1A1F"/>
      <stop offset="100%" stop-color="#160E17"/>
    </linearGradient>
  </defs>
  <style>
    .pulse-dot { transform-box: fill-box; transform-origin: center; animation: pulse 2.8s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.5); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .pulse-dot { animation: none !important; opacity: 1; }
    }
  </style>
  <rect width="380" height="155" fill="url(#qBg)"/>
  <rect x="6" y="6" width="368" height="143" fill="none" stroke="#4D3450" stroke-width="1" opacity="0.4"/>

  <text x="16" y="21" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.5" fill="#B3A7C7" opacity="0.65">FIG. 02</text>
  <text x="364" y="141" text-anchor="end" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.5" fill="#B3A7C7" opacity="0.65">QUANTUM SYSTEMS</text>

  <g fill="none" stroke="#B3A7C7" opacity="0.5">
    <circle cx="190" cy="78" r="47" stroke-width="1"/>
    <ellipse cx="190" cy="78" rx="47" ry="15" stroke-width="0.9" opacity="0.75"/>
    <ellipse cx="190" cy="78" rx="15" ry="47" stroke-width="0.9" opacity="0.75"/>
  </g>
  <line x1="190" y1="28" x2="190" y2="128" stroke="#B3A7C7" stroke-width="0.8" stroke-dasharray="2,3" opacity="0.4"/>

  <text x="190" y="20" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#F0E6D6" opacity="0.85">|0&gt;</text>
  <text x="190" y="140" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#F0E6D6" opacity="0.85">|1&gt;</text>

  <line x1="190" y1="78" x2="230" y2="41" stroke="#7A2438" stroke-width="1.6"/>
  <circle class="pulse-dot" cx="230" cy="41" r="3" fill="#7A2438"/>
  <circle cx="190" cy="78" r="2.2" fill="#B3A7C7"/>
  <text x="237" y="38" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#C98FA0">|ψ&gt;</text>
</svg>
