<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Gauri Sharma — Electrical Engineering times Computer Science. Signals, intelligent systems, computer vision, quantum systems.">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1C1A1F"/>
      <stop offset="100%" stop-color="#160E17"/>
    </linearGradient>
    <radialGradient id="glow" cx="66%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#4D3450" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#4D3450" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .fade-in { animation: heroFade 1.6s ease-out both; }
    .twinkle-a { animation: twinkle 3.4s ease-in-out infinite; }
    .twinkle-b { animation: twinkle 4.1s ease-in-out infinite; animation-delay: 1.3s; }
    .pulse-dot { transform-box: fill-box; transform-origin: center; animation: pulse 2.8s ease-in-out infinite; }
    @keyframes heroFade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.85; } }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.5); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .fade-in, .twinkle-a, .twinkle-b, .pulse-dot { animation: none !important; opacity: 1; }
    }
  </style>

  <rect width="1200" height="420" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" fill="url(#glow)"/>

  <g class="fade-in">

  <rect x="10" y="10" width="1180" height="400" fill="none" stroke="#4D3450" stroke-width="1" opacity="0.4"/>

  <!-- orbital / bloch-sphere geometry, drifting behind the typography -->
  <g fill="none" stroke="#B3A7C7" stroke-width="1" opacity="0.32">
    <ellipse cx="780" cy="215" rx="290" ry="290"/>
    <ellipse cx="780" cy="215" rx="290" ry="98"/>
    <ellipse cx="780" cy="215" rx="130" ry="290"/>
  </g>
  <!-- one deliberately hand-plotted orbit, slightly irregular -->
  <path d="M 470 215 C 520 108 1010 100 1082 210 C 1030 322 540 336 470 215 Z"
        fill="none" stroke="#C98FA0" stroke-width="1" opacity="0.3"/>

  <!-- state vector -->
  <line x1="780" y1="215" x2="944" y2="90" stroke="#7A2438" stroke-width="1.5" opacity="0.85"/>
  <circle class="pulse-dot" cx="944" cy="90" r="3.4" fill="#7A2438"/>
  <circle cx="780" cy="215" r="2.6" fill="#B3A7C7"/>
  <text x="954" y="86" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#C98FA0" opacity="0.75">|ψ&gt;</text>
  <text x="828" y="150" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#B3A7C7" opacity="0.55">θ</text>
  <text x="700" y="195" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#B3A7C7" opacity="0.5">φ</text>

  <!-- faint reference nodes scattered in negative space -->
  <g fill="#B3A7C7">
    <circle class="twinkle-a" cx="1120" cy="60" r="1.4"/>
    <circle opacity="0.45" cx="1080" cy="340" r="1.4"/>
    <circle class="twinkle-b" cx="600" cy="70" r="1.4"/>
    <circle opacity="0.45" cx="360" cy="150" r="1.4"/>
    <circle opacity="0.45" cx="990" cy="360" r="1.4"/>
  </g>

  <!-- coordinate ticks, lower edge -->
  <g stroke="#B3A7C7" stroke-width="1" opacity="0.35">
    <line x1="60" y1="394" x2="60" y2="402"/>
    <line x1="86" y1="394" x2="86" y2="402"/>
    <line x1="112" y1="394" x2="112" y2="402"/>
    <line x1="138" y1="394" x2="138" y2="402"/>
    <line x1="164" y1="394" x2="164" y2="402"/>
    <line x1="190" y1="394" x2="190" y2="402"/>
    <line x1="216" y1="394" x2="216" y2="402"/>
    <line x1="242" y1="394" x2="242" y2="402"/>
  </g>

  <!-- signal / circuit trace, briefly reading as a thorn where it bends -->
  <g fill="none" stroke="#5C1F28" stroke-width="1.3" stroke-linecap="round" opacity="0.55">
    <path d="M 40 330 L 150 330 L 172 312 C 163 309 154 299 161 291 C 166 286 174 289 174 296 C 174 302 182 300 190 298 L 235 298 L 275 268 L 340 268"/>
  </g>
  <g fill="#B3A7C7" opacity="0.6">
    <circle cx="150" cy="330" r="1.8"/>
    <circle cx="275" cy="268" r="1.8"/>
  </g>

  <!-- figure annotations -->
  <text x="48" y="44" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#B3A7C7" opacity="0.7">FIG. 01 / SYSTEM PROFILE</text>
  <text x="1152" y="384" text-anchor="end" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#B3A7C7" opacity="0.7">SIGNAL / COMPUTE / DECISION</text>

  <!-- primary typography -->
  <text x="66" y="196" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="62" fill="#F0E6D6">GAURI SHARMA</text>
  <text x="68" y="230" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="3" fill="#B3A7C7">ELECTRICAL ENGINEERING × COMPUTER SCIENCE</text>
  <text x="68" y="262" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-style="italic" font-size="15" fill="#C98FA0">signals · intelligent systems · computer vision · quantum systems</text>

  </g>
</svg>
