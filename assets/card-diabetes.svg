<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 175" width="760" height="175" role="img" aria-label="Decision-tree classification and SHAP feature contribution chart">
  <defs>
    <linearGradient id="dBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1C1A1F"/>
      <stop offset="100%" stop-color="#160E17"/>
    </linearGradient>
  </defs>
  <rect width="760" height="175" fill="url(#dBg)"/>
  <rect x="6" y="6" width="748" height="163" fill="none" stroke="#4D3450" stroke-width="1" opacity="0.4"/>

  <text x="18" y="24" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#B3A7C7" opacity="0.65">FIG. 04</text>
  <text x="742" y="158" text-anchor="end" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#B3A7C7" opacity="0.65">EXPLAINABLE ML</text>

  <!-- scattered data points -->
  <g fill="#B3A7C7" opacity="0.35">
    <circle cx="60" cy="60" r="1.6"/>
    <circle cx="100" cy="140" r="1.6"/>
    <circle cx="150" cy="45" r="1.6"/>
    <circle cx="210" cy="120" r="1.6"/>
    <circle cx="270" cy="55" r="1.6"/>
    <circle cx="40" cy="105" r="1.6"/>
    <circle cx="300" cy="140" r="1.6"/>
  </g>

  <!-- decision tree -->
  <g fill="none" stroke="#B3A7C7" stroke-width="1" opacity="0.55">
    <line x1="170" y1="45" x2="110" y2="85"/>
    <line x1="170" y1="45" x2="230" y2="85"/>
    <line x1="110" y1="85" x2="75" y2="122"/>
    <line x1="110" y1="85" x2="145" y2="122"/>
    <line x1="230" y1="85" x2="195" y2="122"/>
    <line x1="230" y1="85" x2="265" y2="122"/>
  </g>
  <circle cx="170" cy="45" r="3.4" fill="#160E17" stroke="#B3A7C7" stroke-width="1"/>
  <circle cx="110" cy="85" r="2.8" fill="#160E17" stroke="#B3A7C7" stroke-width="1"/>
  <circle cx="230" cy="85" r="2.8" fill="#160E17" stroke="#B3A7C7" stroke-width="1"/>
  <circle cx="75" cy="122" r="2.4" fill="#7A2438"/>
  <circle cx="145" cy="122" r="2.4" fill="#C98FA0"/>
  <circle cx="195" cy="122" r="2.4" fill="#C98FA0"/>
  <circle cx="265" cy="122" r="2.4" fill="#7A2438"/>

  <!-- SHAP-style feature contribution bars -->
  <g font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#B3A7C7" opacity="0.8">
    <text x="440" y="53">BMI</text>
    <text x="440" y="80">HighBP</text>
    <text x="440" y="107">HighChol</text>
    <text x="440" y="134">Age</text>
  </g>
  <line x1="500" y1="35" x2="500" y2="142" stroke="#4D3450" stroke-width="1" opacity="0.5"/>
  <g stroke-linecap="round">
    <line x1="500" y1="48" x2="620" y2="48" stroke="#7A2438" stroke-width="7"/>
    <line x1="500" y1="75" x2="590" y2="75" stroke="#7A2438" stroke-width="7" opacity="0.85"/>
    <line x1="500" y1="102" x2="565" y2="102" stroke="#7A2438" stroke-width="7" opacity="0.7"/>
    <line x1="500" y1="129" x2="540" y2="129" stroke="#7A2438" stroke-width="7" opacity="0.55"/>
  </g>
</svg>
